
name: MATRIX GAMING - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: matrix-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/*}"
            if [ "$candidate" = "$file" ]; then
              candidate="."
            fi
            PROJECT_DIR="$candidate"
            break
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Validate Gradle files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing."
            exit 1
          fi
          chmod +x gradlew
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERROR: Root build.gradle file is missing."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-APK
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
