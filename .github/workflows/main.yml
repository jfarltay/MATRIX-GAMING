
name: MATRIX GAMING 5.28.2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found"
            exit 1
          fi

          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$MANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Extract and locate MATRIX project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/matrix-source"
          mkdir -p "$WORK"

          PROJECT=""

          find_project() {
            local ROOT="$1"
            while IFS= read -r FILE; do
              local DIR
              DIR="$(dirname "$FILE")"

              if { [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; } && \
                 { [ -f "$DIR/build.gradle" ] || [ -f "$DIR/build.gradle.kts" ]; }; then
                PROJECT="$DIR"
                return 0
              fi
            done < <(
              find "$ROOT" -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' | sort
            )
            return 1
          }

          if find_project "$GITHUB_WORKSPACE"; then
            echo "Found project directly in repository."
          else
            echo "Searching for source ZIP archives..."

            while IFS= read -r ZIP; do
              echo "Checking archive: $ZIP"

              DEST="$WORK/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"

              if ! unzip -oq "$ZIP" -d "$DEST"; then
                echo "Skipping invalid ZIP: $ZIP"
                continue
              fi

              if find_project "$DEST"; then
                echo "Project found inside archive."
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
                -not -path '*/.git/*' | sort
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::No valid Android project found."
            echo "The repository must contain the extracted project or its source ZIP."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "MATRIX project: $PROJECT"

      - name: Verify project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt" ]; then
            echo "::error::CMakeLists.txt is missing from the Android project."
            exit 1
          fi

          if ! grep -R "arm64-v8a" "$PROJECT_DIR/app" \
            --include='*.gradle' --include='*.gradle.kts' >/dev/null; then
            echo "::error::ARM64 configuration was not found."
            exit 1
          fi

      - name: Build MATRIX GAMING APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug
          fi

      - name: Find and prepare APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -size +0c -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          OUT="$GITHUB_WORKSPACE/release"
          mkdir -p "$OUT"

          cp "$APK" "$OUT/MATRIX-GAMING-5.28.2-ARM64-debug.apk"

          cd "$OUT"
          sha256sum MATRIX-GAMING-5.28.2-ARM64-debug.apk > SHA256SUMS.txt

          echo "APK_PATH=$OUT/MATRIX-GAMING-5.28.2-ARM64-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.28.2-APK-DOWNLOAD
          path: |
            ${{ steps.apk.outputs.APK_PATH }}
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
