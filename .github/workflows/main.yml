
name: MATRIX GAMING 5.37 - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: ''

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/matrix-source"

          ZIP="$GITHUB_WORKSPACE/MATRIX_GAMING_5.37_FIXED_ROOT_SCOPE.zip"

          if [ -f "$ZIP" ]; then
            echo "Using corrected ROOT_SCOPE archive."
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/matrix-source"
          else
            echo "::error::MATRIX_GAMING_5.37_FIXED_ROOT_SCOPE.zip is missing from repository root."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -100
            exit 1
          fi

          ROOT=""

          while IFS= read -r -d '' file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              ROOT="$candidate"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/matrix-source" \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$ROOT" ]; then
            APP_FILE="$(find "$RUNNER_TEMP/matrix-source" \
              \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
              -print -quit)"

            if [ -n "$APP_FILE" ]; then
              APP_DIR="$(dirname "$APP_FILE")"
              ROOT="$(dirname "$APP_DIR")"

              if [ ! -f "$ROOT/settings.gradle" ] && \
                 [ ! -f "$ROOT/settings.gradle.kts" ]; then
                echo "::error::Found app Gradle file but no settings.gradle in its parent."
                echo "Detected app directory: $APP_DIR"
                find "$RUNNER_TEMP/matrix-source" -maxdepth 5 -type f | head -100
                exit 1
              fi
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Could not locate a complete Android project."
            find "$RUNNER_TEMP/matrix-source" -maxdepth 6 -type f | head -150
            exit 1
          fi

          echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"
          ls -la "$ROOT"
          ls -la "$ROOT/app"

      - name: Verify project files
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure verified."

      - name: Verify Java source
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/matrix/gaming/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity.java found."
          grep -n 'showPs3ProStyle' "$FILE" || true

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle --no-daemon \
            -Pandroid.injected.ndkVersion=27.0.12077973 \
            :app:assembleDebug

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Generated APK: $APK"
          ls -lh "$APK"

      - name: Upload MATRIX GAMING APK
        uses: actions/upload-artifact@v5
        with:
          name: MATRIX-GAMING-5.37-DEBUG-APK
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
