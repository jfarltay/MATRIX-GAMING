
name: MATRIX GAMING 5.23 - Build and Download APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -print -quit)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            mapfile -t PROJECTS < <(
              find . -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path "*/.git/*" \
                -printf '%h\n' | sort
            )

            if [ "${#PROJECTS[@]}" -ne 1 ]; then
              echo "::error::Could not identify one Android project"
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            fi

            PROJECT_DIR="${PROJECTS[0]}"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle file not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build MATRIX GAMING APK
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK" "release/MATRIX-GAMING-5.23.apk"

          cat > release/INSTALL.txt <<'EOF'
          MATRIX GAMING 5.23
          Open the APK on your Android device.
          Allow installation from this source if requested.
          Tap Install.
          EOF

          ls -lh release/

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.23-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
