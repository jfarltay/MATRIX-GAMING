
name: MATRIX GAMING 5.28 - ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.properties'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.xml'
      - '**/*.aar'
      - '**/*.jar'
      - '**/*.so'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: matrix-gaming-5-28-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/matrix-gaming-source"
          mkdir -p "$WORK"

          shopt -s nullglob
          ZIPS=("$ROOT"/*.zip)
          if [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ] && [ ${#ZIPS[@]} -gt 0 ]; then
            for archive in "${ZIPS[@]}"; do
              unzip -oq "$archive" -d "$WORK"
            done
          fi

          SEARCH_ROOT="$ROOT"
          if find "$WORK" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | grep -q .; then
            SEARCH_ROOT="$WORK"
          fi

          PROJECT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT="$candidate"
              break
            fi
          done < <(find "$SEARCH_ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.git/*' -not -path '*/.gradle/*' | sort)

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found. Add the project source or a ZIP containing settings.gradle and app/build.gradle."
            find "$ROOT" -maxdepth 4 -type f | sort | head -120
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Validate Android project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -d "$PROJECT_DIR/app/src/main"

          if ! grep -R -E 'arm64-v8a|abiFilters' "$PROJECT_DIR/app" --include='*.gradle' --include='*.gradle.kts' >/dev/null; then
            echo "::warning::No explicit ARM64 ABI filter found."
          fi

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug
          fi

      - name: Verify APK
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not created."
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare package
        shell: bash
        env:
          APK_PATH: ${{ steps.verify.outputs.apk_path }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/MATRIX-GAMING-5.28-ARM64"
          mkdir -p "$OUT"
          cp "$APK_PATH" "$OUT/MATRIX-GAMING-5.28-debug.apk"
          (cd "$OUT" && sha256sum MATRIX-GAMING-5.28-debug.apk > SHA256SUMS.txt)
          cat > "$OUT/INSTALL.txt" <<'TXT'
          MATRIX GAMING 5.28 - Android APK
          This is a debug APK, not a Play Store release-signed APK.
          TXT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.28-ARM64-APK
          path: |
            MATRIX-GAMING-5.28-ARM64/MATRIX-GAMING-5.28-debug.apk
            MATRIX-GAMING-5.28-ARM64/SHA256SUMS.txt
            MATRIX-GAMING-5.28-ARM64/INSTALL.txt
          if-no-files-found: error
          retention-days: 30
