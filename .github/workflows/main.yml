
name: MATRIX GAMING 5.27 - Android ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.properties'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.xml'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: matrix-gaming-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory was not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in Android SDK."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "SDK=$SDK"
          echo "SDKMANAGER=$SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Extract MATRIX GAMING project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$RUNNER_TEMP/matrix-gaming-source"
          mkdir -p "$SOURCE"

          ZIP="$GITHUB_WORKSPACE/MATRIX_GAMING_5.27_WELCOME_HEADER.zip"

          if [ -f "$ZIP" ]; then
            echo "Extracting MATRIX GAMING 5.27..."
            unzip -q "$ZIP" -d "$SOURCE"
            SEARCH="$SOURCE"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || \
               [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            echo "Using project directly from repository..."
            SEARCH="$GITHUB_WORKSPACE"
          else
            echo "::error::MATRIX_GAMING_5.27_WELCOME_HEADER.zip was not found."
            echo "Upload the ZIP to the repository root."
            exit 1
          fi

          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if { [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; } && \
               [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$SEARCH" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/.git/*' | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Android Gradle project was not found in the ZIP."
            find "$SEARCH" -maxdepth 5 -type f | head -150
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT"

      - name: Verify Android project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt"

          echo "Android project files verified."

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace \
              clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace \
              clean :app:assembleDebug
          fi

      - name: Verify APK output
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.27-ARM64-debug.apk"

          cd "$GITHUB_WORKSPACE/release"

          sha256sum MATRIX-GAMING-5.27-ARM64-debug.apk \
            > SHA256SUMS.txt

          echo "apk_path=$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.27-ARM64-debug.apk" \
            >> "$GITHUB_OUTPUT"

          echo "APK generated successfully."
          ls -lh MATRIX-GAMING-5.27-ARM64-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.27-ARM64-APK
          path: |
            release/MATRIX-GAMING-5.27-ARM64-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
