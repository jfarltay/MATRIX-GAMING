
name: MATRIX GAMING 3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _matrix_extract
          while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -oq "$file" -d _matrix_extract
          done < <(find . -maxdepth 3 -type f -name '*.zip' \
            -not -path './_matrix_extract/*' -print0)

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find . \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -not -path './_matrix_extract/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find _matrix_extract \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit || true)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android module
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-3.0-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
