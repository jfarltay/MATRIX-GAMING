
name: MATRIX GAMING 5.23 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Download APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Extract and find Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for project ZIP..."

          ZIP_FILE="MATRIX_GAMING_5.23_ARM64_DOWNLOAD_WORKFLOW.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Expected ZIP not found: $ZIP_FILE"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          SOURCE_DIR="$RUNNER_TEMP/matrix-gaming-source"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          echo "Searching extracted files..."

          mapfile -t SETTINGS_FILES < <(
            find "$SOURCE_DIR" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print
          )

          if [ "${#SETTINGS_FILES[@]}" -eq 0 ]; then
            echo "::error::settings.gradle was not found inside ZIP"
            find "$SOURCE_DIR" -maxdepth 6 -type f -print | head -200
            exit 1
          fi

          PROJECT_DIR=""

          for SETTINGS_FILE in "${SETTINGS_FILES[@]}"; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No project with settings.gradle and app module found"
            find "$SOURCE_DIR" -maxdepth 7 -type f -print | head -250
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Build MATRIX GAMING APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Prepare APK download
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK" "release/MATRIX-GAMING-5.23.apk"

          echo "MATRIX GAMING 5.23" > release/INSTALL.txt
          echo "Open the APK on Android and tap Install." >> release/INSTALL.txt

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.23-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
