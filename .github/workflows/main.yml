
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android app module..."

          mapfile -t APP_FILES < <(
            find . \
              -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
              -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
              -print | sort
          )

          if [ "${#APP_FILES[@]}" -eq 0 ]; then
            echo "::error::No app/build.gradle or app/build.gradle.kts found."
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Found app modules:"
          printf '%s\n' "${APP_FILES[@]}"

          # Prefer the app module whose parent has settings.gradle.
          PROJECT_DIR=""

          for APP_FILE in "${APP_FILES[@]}"; do
            CANDIDATE="$(dirname "$(dirname "$APP_FILE")")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          # If settings.gradle is absent, use the first app module found.
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(dirname "$(dirname "${APP_FILES[0]}")")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected Android project: $PROJECT_DIR"
