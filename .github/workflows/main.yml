name: MATRIX GAMING 2.7 - APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MATRIX GAMING ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name "MATRIX_GAMING_2.7*.zip" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p _matrix_source
            unzip -q "$ZIP_FILE" -d _matrix_source
          fi

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file missing"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK successfully generated"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-2.7-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
