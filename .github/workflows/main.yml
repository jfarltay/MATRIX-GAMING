
name: MATRIX GAMING 4.2 - Verified Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/matrix_extract"

          while IFS= read -r -d '' file; do
            folder="$RUNNER_TEMP/matrix_extract/$(basename "$file" .zip)"
            mkdir -p "$folder"
            echo "Extracting: $file"
            unzip -oq "$file" -d "$folder"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print0
          )

      - name: Locate Android Project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=""

          for ROOT in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/matrix_extract"; do
            [ -d "$ROOT" ] || continue

            SETTINGS="$(find "$ROOT" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit || true)"

            if [ -n "$SETTINGS" ]; then
              break
            fi
          done

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle configuration not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Build Environment
        run: |
          java -version
          gradle --version

      - name: Build MATRIX GAMING
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            --warning-mode all \
            clean :app:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-4.2-APK
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
