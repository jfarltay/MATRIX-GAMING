
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          "$ANDROID_HOME/platform-tools/adb" version

          echo "Android SDK installed and verified successfully."
