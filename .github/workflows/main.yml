
name: MATRIX GAMING 5.28.2 - APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish APK download
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found"
            exit 1
          fi

          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$MANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Locate MATRIX Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if { [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; } && \
               { [ -f "$DIR/build.gradle" ] || [ -f "$DIR/build.gradle.kts" ]; }; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$ROOT" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::MATRIX Android project not found. Extract the source ZIP into the repository before running."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT"

      - name: Verify Android files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if ! grep -R "arm64-v8a" "$PROJECT_DIR/app" \
            --include='*.gradle' --include='*.gradle.kts' >/dev/null; then
            echo "::error::ARM64 configuration not found"
            exit 1
          fi

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug
          fi

      - name: Find and prepare APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -size +0c -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          OUT="$GITHUB_WORKSPACE/MATRIX-GAMING-5.28.2-DOWNLOAD"
          mkdir -p "$OUT"

          cp "$APK" "$OUT/MATRIX-GAMING-5.28.2-ARM64.apk"
          sha256sum "$OUT/MATRIX-GAMING-5.28.2-ARM64.apk" > "$OUT/SHA256SUMS.txt"

          echo "APK_PATH=$OUT/MATRIX-GAMING-5.28.2-ARM64.apk" >> "$GITHUB_OUTPUT"
          echo "APK successfully prepared"

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.28.2-APK-DOWNLOAD
          path: |
            ${{ steps.apk.outputs.APK_PATH }}
            MATRIX-GAMING-5.28.2-DOWNLOAD/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
