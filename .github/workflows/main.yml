
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking Java..."
          java -version

          echo "Checking Gradle..."
          gradle --version

          echo "Checking Android project..."
          ls -la
          ls -la app

          echo "Starting MATRIX APK build..."
          gradle --no-daemon --stacktrace --info :app:assembleDebug
