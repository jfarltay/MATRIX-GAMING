
name: MATRIX GAMING 4.2 - SDK COMBINED FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in Android SDK."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager || true
            exit 1
          fi

          SDK_BIN="$(dirname "$SDKMANAGER")"

          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Found SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

          echo "Checking SDK licenses..."
          "$SDKMANAGER" --licenses </dev/null

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit || true)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle configuration not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MATRIX GAMING
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            clean :app:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-4.2-APK
          path: ${{ steps.verify.outputs.path }}
          if-no-files-found: error
