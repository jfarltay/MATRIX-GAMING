
name: MATRIX GAMING APK BUILDER

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-gaming-build
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="MATRIX_GAMING_5.41_DYNAMIC_XMB_PREVIEW.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          find extracted -maxdepth 4 -type f | head -n 100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_WRAPPER=$(find extracted -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$GRADLE_WRAPPER" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_WRAPPER")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file is missing beside gradlew."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished but no APK was found."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK found: $APK"

      - name: Upload MATRIX GAMING APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
