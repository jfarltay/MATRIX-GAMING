
name: MATRIX GAMING - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Locate and Extract MATRIX Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/matrix-extracted"

          mkdir -p "$EXTRACT"

          SETTINGS="$(find "$ROOT" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            mapfile -t ZIPS < <(
              find "$ROOT" -maxdepth 5 -type f -iname '*.zip' \
                -not -path '*/.git/*' | sort
            )

            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "::error::No Android project or ZIP file found."
              echo "Upload the MATRIX project ZIP to the repository."
              exit 1
            fi

            for ZIP in "${ZIPS[@]}"; do
              echo "Extracting: $ZIP"
              DEST="$EXTRACT/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"
              unzip -oq "$ZIP" -d "$DEST"
            done

            SETTINGS="$(find "$EXTRACT" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP extracted, but settings.gradle was not found."
            echo "The ZIP may not contain a complete Android Studio project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "MATRIX project detected successfully."

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Build MATRIX GAMING Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            find "${{ steps.project.outputs.dir }}/app/build/outputs" \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          echo "MATRIX GAMING APK verified."

      - name: Upload MATRIX GAMING APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-DEBUG-APK
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
