
name: MATRIX GAMING - YAML FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix_project"

          find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
            -not -path '*/.git/*' -print0 |
          while IFS= read -r -d '' file; do
            name="$(basename "$file" .zip)"
            dest="$RUNNER_TEMP/matrix_project/$name"
            mkdir -p "$dest"
            echo "Extracting $file"
            unzip -oq "$file" -d "$dest"
          done

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=""

          for root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/matrix_project"; do
            [ -d "$root" ] || continue

            SETTINGS="$(find "$root" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit || true)"

            [ -n "$SETTINGS" ] && break
          done

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found. Repository must contain settings.gradle or settings.gradle.kts."
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -200
            echo "Files extracted from ZIP:"
            find "$RUNNER_TEMP/matrix_project" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Gradle wrapper gradlew is missing from $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found under $PROJECT_DIR/app"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Build MATRIX GAMING
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.dir }}"
          APK="$(find "$PROJECT" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
