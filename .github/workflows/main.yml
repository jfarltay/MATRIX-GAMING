
name: MATRIX GAMING 5.10 APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ZIP_FILE: MATRIX_GAMING_5.10_DARK_MODE_COLOR_SETTINGS.zip
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing source ZIP: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          SETTINGS_FILE=$(find source -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/MATRIX-GAMING-5.10.apk
          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.10-APK
          path: release/MATRIX-GAMING-5.10.apk
          if-no-files-found: error
          retention-days: 14
