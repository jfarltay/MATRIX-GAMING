
name: MATRIX GAMING 5.37 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"
            if [[ -f "$DIR/app/build.gradle" || \
                  -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' | sort
          )

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android project not found."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT"

      - name: Validate project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/build.gradle" || \
            test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug
          fi

      - name: Find APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.37.apk"
          sha256sum "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.37.apk" \
            > "$GITHUB_WORKSPACE/release/SHA256SUMS.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MATRIX-GAMING-5.37-APK
          path: |
            release/MATRIX-GAMING-5.37.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
