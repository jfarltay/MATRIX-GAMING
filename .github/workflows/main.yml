
name: MATRIX GAMING 5.8 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found."
            exit 1
          fi

          echo "manager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "${{ steps.sdk.outputs.manager }}" --licenses
          echo "License acceptance command completed."

      - name: Install Android SDK packages
        shell: bash
        run: |
          "${{ steps.sdk.outputs.manager }}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        shell: bash
        run: |
          ZIP_FILE="MATRIX_GAMING_5.8_LIBRARY_AND_PS2_CONTROLS.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Source ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR=$(find "$PWD/source" \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "App Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.8-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
