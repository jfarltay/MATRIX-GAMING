name: MATRIX GAMING 5.28 - APK DOWNLOAD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --licenses

      - name: Install Android SDK Packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Find Android Project
        shell: bash
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or ZIP file not found."
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle not found inside ZIP."
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build Debug APK
        shell: bash
        run: |
          gradle --no-daemon assembleDebug

      - name: Collect APK
        id: collect
        if: always()
        shell: bash
        run: |
          mkdir -p download

          APK=$(find . -type f -path "*/build/outputs/apk/*/*.apk" \
            -not -path "./download/*" | head -n 1)

          if [ -n "$APK" ]; then
            cp "$APK" download/MATRIX-GAMING-5.28.apk
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "APK found: $APK"
            ls -lh download/
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No APK was generated."
          fi

      - name: Upload APK Download
        if: steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.28-APK
          path: download/MATRIX-GAMING-5.28.apk
          if-no-files-found: error
          retention-days: 30
