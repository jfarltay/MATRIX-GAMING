
name: MATRIX GAMING 5.31 - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            SDK="/opt/android-sdk"
          fi

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              \( -path '*/.git' -o -path '*/.gradle' \) -prune \
              -o -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Project settings.gradle or app module not found"
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT"

      - name: Verify project configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          grep -R "arm64-v8a" "$PROJECT_DIR/app" \
            --include='*.gradle' \
            --include='*.gradle.kts' >/dev/null || {
              echo "::error::ARM64 ABI configuration missing"
              exit 1
            }

          java -version
          gradle --version

      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.31-ARM64-debug.apk"

          cd "$GITHUB_WORKSPACE/release"

          sha256sum MATRIX-GAMING-5.31-ARM64-debug.apk \
            > SHA256SUMS.txt

          echo "apk_path=release/MATRIX-GAMING-5.31-ARM64-debug.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.31-ARM64-APK
          path: |
            release/MATRIX-GAMING-5.31-ARM64-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
