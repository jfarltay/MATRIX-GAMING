
name: MATRIX GAMING 5.0.2 - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t projects < <(
            find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' -printf '%h\n' | sort
          )

          if [ "${#projects[@]}" -eq 0 ]; then
            ZIP_FILE=$(find . -maxdepth 4 -type f -iname '*MATRIX*5.0.2*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Android project or MATRIX 5.0.2 ZIP not found."
              exit 1
            fi

            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project

            mapfile -t projects < <(
              find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -printf '%h\n' | sort
            )
          fi

          if [ "${#projects[@]}" -ne 1 ]; then
            echo "::error::Expected one Android project; found ${#projects[@]}."
            printf '%s\n' "${projects[@]}"
            exit 1
          fi

          PROJECT_DIR="${projects[0]}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager)"
          echo "Using: $SDKMANAGER"

          python3 - <<'PY'
          import subprocess
          import shutil

          sdkmanager = shutil.which("sdkmanager")
          if not sdkmanager:
              raise SystemExit("sdkmanager was not found")

          result = subprocess.run(
              [sdkmanager, "--licenses"],
              input="y\n" * 100,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT
          )

          print(result.stdout)

          if result.returncode != 0:
              raise SystemExit("SDK license acceptance failed")
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.0.2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
