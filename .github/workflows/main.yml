
name: MATRIX GAMING 5.23 - ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.xml'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.c'
      - '**/*.png'
      - '**/*.webp'
      - '**/*.jpg'
      - '**/*.ogg'
      - '**/*.m4a'
      - '**/*.properties'
      - '**/CMakeLists.txt'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK - ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK" --licenses < <(yes || true)

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            mapfile -t PROJECTS < <(
              find . -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path "./.git/*" \
                -printf '%h\n' | sort
            )

            if [ "${#PROJECTS[@]}" -ne 1 ]; then
              echo "::error::Expected one Android project."
              printf '%s\n' "${PROJECTS[@]:-No project found}"
              exit 1
            fi

            PROJECT_DIR="${PROJECTS[0]}"
          fi

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build MATRIX GAMING
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Check APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload MATRIX GAMING APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.23-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
