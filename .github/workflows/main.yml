
name: MATRIX GAMING 4.2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SETTINGS=""

          SETTINGS="$(find "$ROOT" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -not -path '*/.matrix-project/*' \
            -print -quit || true)"

          if [[ -z "$SETTINGS" ]]; then
            ZIP_FILE="$(find "$ROOT" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -not -path '*/.git/*' \
              -print -quit || true)"

            if [[ -n "$ZIP_FILE" ]]; then
              mkdir -p "$ROOT/.matrix-project"
              unzip -oq "$ZIP_FILE" -d "$ROOT/.matrix-project"

              SETTINGS="$(find "$ROOT/.matrix-project" \
                -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print -quit || true)"
            fi
          fi

          if [[ -z "$SETTINGS" ]]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && \
                ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK"
          echo "APK_BUILD_SUCCESS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-4.2-DEBUG
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
