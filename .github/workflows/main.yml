
name: MATRIX GAMING 5.37 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: ''

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Extract project ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix-extracted"

          while IFS= read -r -d '' ZIP; do
            NAME="$(basename "$ZIP" .zip)"
            DEST="$RUNNER_TEMP/matrix-extracted/$NAME"
            mkdir -p "$DEST"
            echo "Extracting $ZIP"
            unzip -q "$ZIP" -d "$DEST"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -name '*.zip' -print0
          )

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=""

          for ROOT in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/matrix-extracted"; do
            while IFS= read -r SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if [[ -f "$DIR/app/build.gradle" || \
                    -f "$DIR/app/build.gradle.kts" ]]; then
                PROJECT="$DIR"
                break 2
              fi
            done < <(
              find "$ROOT" -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' | sort
            )
          done

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android project not found."
            echo "The ZIP must contain settings.gradle and app/build.gradle."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Validate project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/settings.gradle" || \
            test -f "$PROJECT_DIR/settings.gradle.kts"

      - name: Build Debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug
          fi

      - name: Prepare APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' | sort | head -n 1)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.37.apk"

          sha256sum "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.37.apk" \
            > "$GITHUB_WORKSPACE/release/SHA256SUMS.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MATRIX-GAMING-5.37-APK
          path: |
            release/MATRIX-GAMING-5.37.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
