
name: MATRIX GAMING 4.2 - SDK FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          for DIR in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/matrix_rev_work"; do
            if [ -f "$DIR/settings.gradle" ] && [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done

          if [ -z "$PROJECT" ]; then
            SETTINGS="$(find "$GITHUB_WORKSPACE" \
              -type f -name settings.gradle \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit || true)"

            if [ -n "$SETTINGS" ]; then
              PROJECT="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Android project files not found."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MATRIX GAMING
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            clean :app:assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-4.2-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
