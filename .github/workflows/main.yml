
name: MATRIX GAMING 5.31 Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Extract project ZIP files before searching for Gradle
      - name: Extract project archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/matrix_source"

          FOUND=false

          while IFS= read -r -d '' FILE; do
            echo "Extracting: $FILE"
            DEST="$RUNNER_TEMP/matrix_source/$(basename "$FILE" .zip)"
            mkdir -p "$DEST"
            unzip -oq "$FILE" -d "$DEST"
            FOUND=true
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 -type f -iname '*.zip' \
              -print0
          )

          echo "ZIP extraction completed: $FOUND"

      # Locate the actual Android Gradle project
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          for ROOT in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/matrix_source"; do
            [ -d "$ROOT" ] || continue

            while IFS= read -r -d '' FILE; do
              DIR="$(dirname "$FILE")"

              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find "$ROOT" \
                \( -path '*/.git' -o -path '*/.gradle' \
                   -o -path '*/build' \) -prune \
                -o -type f \
                \( -name settings.gradle \
                   -o -name settings.gradle.kts \) \
                -print0
            )

            [ -n "$PROJECT" ] && break
          done

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -200
            echo "Extracted files:"
            find "$RUNNER_TEMP/matrix_source" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found: $SDK"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Verify project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project structure verified."
          java -version
          gradle --version

      - name: Build MATRIX GAMING APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify and prepare APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.31.apk"

          cd "$GITHUB_WORKSPACE/release"
          sha256sum MATRIX-GAMING-5.31.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.31-APK
          path: |
            release/MATRIX-GAMING-5.31.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
