name: MATRIX GAMING - Android Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build MATRIX GAMING APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Find project ZIP
    id: project
    run: |
      ZIP_FILE=$(find . -type f -iname "MATRIX_GAMING*.zip" | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: MATRIX_GAMING ZIP not found"
        exit 1
      fi
      echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
      echo "Found: $ZIP_FILE"

  - name: Extract project
    run: |
      mkdir -p project
      unzip -q "${{ steps.project.outputs.zip }}" -d project

      if [ -f project/gradlew ]; then
        cp -a project/. .
      else
        find project -name gradlew -type f -print -quit | while read f; do
          DIR=$(dirname "$f")
          cp -a "$DIR"/. .
        done
      fi

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build Debug APK
    run: |
      chmod +x gradlew
      ./gradlew --no-daemon clean assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MATRIX-GAMING-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
