
name: MATRIX GAMING - Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          SETTINGS="$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit || true)"

          if [[ -z "$SETTINGS" ]]; then
            ZIP_FILE="$(find "$ROOT" -maxdepth 4 -type f -iname '*.zip' -print -quit || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi

            mkdir -p "$ROOT/.matrix-project"
            unzip -oq "$ZIP_FILE" -d "$ROOT/.matrix-project"

            SETTINGS="$(find "$ROOT/.matrix-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit || true)"
          fi

          if [[ -z "$SETTINGS" ]]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK
        run: |
          test -s "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
