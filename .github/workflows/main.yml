
name: MATRIX GAMING 5.13 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING 5.13
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ZIP_FILE: MATRIX_GAMING_5.13_PS2_AND_APP_FEATURES.zip
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager is missing"
            exit 1
          fi

          echo "manager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Found SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eu

          set +o pipefail
          yes | "${{ steps.sdk.outputs.manager }}" \
            --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]:-0}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed"
            exit 1
          fi

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          "${{ steps.sdk.outputs.manager }}" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          SETTINGS_FILE="$(find source -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/MATRIX-GAMING-5.13.apk
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.13-APK
          path: release/MATRIX-GAMING-5.13.apk
          if-no-files-found: error
          retention-days: 14
