name: MATRIX GAMING - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "MATRIX_GAMING_5.42_LANDSCAPE_XMB_PS2_STAGE.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.9"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Check project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="MATRIX_GAMING_5.42_LANDSCAPE_XMB_PS2_STAGE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$RUNNER_TEMP/matrix-gaming-source"

          mkdir -p "$SOURCE_DIR"

          unzip -q \
            "MATRIX_GAMING_5.42_LANDSCAPE_XMB_PS2_STAGE.zip" \
            -d "$SOURCE_DIR"

          echo "Searching for Android project..."

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found."
            find "$SOURCE_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app Gradle file not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found."
            exit 1
          fi

          APK_FILE="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Build finished but no APK was generated."
            find "$APK_DIR" -type f
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/matrix-apk"

          cp "$APK_FILE" "$RUNNER_TEMP/matrix-apk/MATRIX-GAMING-debug.apk"

          echo "APK successfully generated:"
          ls -lh "$RUNNER_TEMP/matrix-apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-APK
          path: ${{ runner.temp }}/matrix-apk/MATRIX-GAMING-debug.apk
          if-no-files-found: error
          retention-days: 14
