
name: MATRIX GAMING 4.2 - ALL FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Found: $SDKMANAGER"

      - name: Accept SDK Licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Project ZIP Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/matrix_extract"

          while IFS= read -r -d '' file; do
            name="$(basename "$file" .zip)"
            destination="$RUNNER_TEMP/matrix_extract/$name"

            mkdir -p "$destination"

            echo "Extracting: $file"
            unzip -oq "$file" -d "$destination"

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print0
          )

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=""

          for ROOT in \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/matrix_extract"; do

            [ -d "$ROOT" ] || continue

            SETTINGS="$(find "$ROOT" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit || true)"

            if [ -n "$SETTINGS" ]; then
              break
            fi
          done

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            echo "Extracted files:"
            find "$RUNNER_TEMP/matrix_extract" -maxdepth 6 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle configuration not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MATRIX GAMING
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            clean :app:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-4.2-APK
          path: ${{ steps.verify.outputs.path }}
          if-no-files-found: error
