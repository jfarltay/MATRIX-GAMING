name: MATRIX GAMING 5.37 - Android ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.properties'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.xml'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: matrix-gaming-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING 5.37
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          # Prefer an Android project already committed to the repository.
          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$SEARCH_ROOT" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -not -path '*/.gradle/*' | sort)

          # Otherwise extract the supplied 5.37 source archive.
          if [[ -z "$PROJECT" ]]; then
            ZIP_FILE="$GITHUB_WORKSPACE/MATRIX_GAMING_5.37_WORLD_CLOCK_STAGE.zip"
            if [[ ! -f "$ZIP_FILE" ]]; then
              echo "::error::No Android project found and MATRIX_GAMING_5.37_WORLD_CLOCK_STAGE.zip is missing from the repository root."
              exit 1
            fi
            EXTRACT_DIR="$RUNNER_TEMP/matrix-537-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            while IFS= read -r SETTINGS; do
              DIR="$(dirname "$SETTINGS")"
              if [[ -f "$DIR/app/build.gradle" || -f "$DIR/app/build.gradle.kts" ]]; then
                PROJECT="$DIR"
                break
              fi
            done < <(find "$EXTRACT_DIR" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -not -path '*/.gradle/*' | sort)
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Could not locate settings.gradle and app/build.gradle in the repository or archive."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT"

      - name: Validate Android project configuration
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          grep -R "arm64-v8a" "$PROJECT_DIR/app" \
            --include='*.gradle' --include='*.gradle.kts' >/dev/null || {
              echo "::error::The app does not declare the arm64-v8a ABI."
              exit 1
            }

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug
          fi

      - name: Verify APK and calculate checksum
        id: output
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not produced."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.37-ARM64-debug.apk"
          cd "$GITHUB_WORKSPACE/release"
          sha256sum MATRIX-GAMING-5.37-ARM64-debug.apk > SHA256SUMS.txt
          echo "apk=release/MATRIX-GAMING-5.37-ARM64-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.37-ARM64-APK
          path: |
            release/MATRIX-GAMING-5.37-ARM64-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
