name: MATRIX GAMING - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Project ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "MATRIX_GAMING*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MATRIX_GAMING ZIP file not found"
            exit 1
          fi

          mkdir -p _source
          unzip -q "$ZIP_FILE" -d _source

          GRADLEW=$(find _source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found successfully"

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload MATRIX GAMING APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
