
name: MATRIX GAMING 5.37 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: ''

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4

      - name: Install SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Find and extract MATRIX source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          # First check whether the project is already extracted.
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/app/build.gradle" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" -name settings.gradle -o -name settings.gradle.kts -print0)

          # Otherwise extract the corrected source archive.
          if [ -z "$PROJECT" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" -type f -name 'MATRIX_GAMING_5.37_FIXED_JAVA_STRING.zip' -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "Corrected MATRIX 5.37 ZIP was not found in the repository."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/matrix-source"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/matrix-source"

            while IFS= read -r -d '' file; do
              dir="$(dirname "$file")"
              if [ -f "$dir/app/build.gradle" ]; then
                PROJECT="$dir"
                break
              fi
            done < <(find "$RUNNER_TEMP/matrix-source" \( -name settings.gradle -o -name settings.gradle.kts \) -print0)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Android project not found: settings.gradle and app/build.gradle are required."
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT"

      - name: Verify corrected Java source
        shell: bash
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/matrix/gaming/MainActivity.java"

          test -f "$FILE"

          grep -n 'واجهة مستوحاة من حركة XMB وثيمات PS3 PRO' "$FILE"

          if grep -q 'واجهة مستوحاة من حركة XMB وثيمات PS3 PRO$' "$FILE"; then
            echo "The old broken multiline Java string is still present."
            exit 1
          fi

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: |
          set -euo pipefail

          gradle --version
          gradle --no-daemon \
            -Pandroid.injected.ndkVersion=27.0.12077973 \
            :app:assembleDebug

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"

      - name: Upload MATRIX GAMING APK
        uses: actions/upload-artifact@v5
        with:
          name: MATRIX-GAMING-5.37-DEBUG-APK
          path: ${{ steps.source.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
