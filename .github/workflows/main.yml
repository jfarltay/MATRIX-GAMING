
name: MATRIX GAMING 5.28.2 - ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.properties'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/*.png'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: matrix-gaming-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found: $SDK"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          if { [ -f settings.gradle ] || [ -f settings.gradle.kts ]; } && \
             { [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; }; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            while IFS= read -r FILE; do
              DIR="$(dirname "$FILE")"
              if { [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; }; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' | sort
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found. Upload the extracted project source to the repository."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT"

      - name: Verify project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt"

          grep -q "arm64-v8a" "$PROJECT_DIR/app/build.gradle" || {
            echo "::error::ARM64 ABI filter is missing."
            exit 1
          }

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug
          fi

      - name: Locate and prepare APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Build finished but APK was not found."
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/MATRIX-GAMING-5.28.2-ARM64-debug.apk"

          cd "$GITHUB_WORKSPACE/release"

          sha256sum MATRIX-GAMING-5.28.2-ARM64-debug.apk > SHA256SUMS.txt

          cat > INSTALL.txt <<'EOF'
          MATRIX GAMING 5.28.2
          Architecture: ARM64

          Install:
          1. Download the APK.
          2. Open it on your Android phone.
          3. Allow installation from this source if Android asks.
          4. Tap Install.
          EOF

          echo "apk=release/MATRIX-GAMING-5.28.2-ARM64-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.28.2-ARM64-APK
          path: |
            ${{ steps.apk.outputs.apk }}
            release/SHA256SUMS.txt
            release/INSTALL.txt
          if-no-files-found: error
          retention-days: 30
