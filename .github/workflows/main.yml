name: MATRIX GAMING 4.2 - APK Build Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate MATRIX Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SETTINGS="$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit || true)"
          if [[ -z "$SETTINGS" ]]; then
            echo 'ERROR: settings.gradle or settings.gradle.kts was not found.'
            find "$ROOT" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: app Gradle file not found in $PROJECT_DIR/app"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Build MATRIX Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean :app:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK was not created at $APK"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload MATRIX APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-4.2-DEBUG-APK
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
