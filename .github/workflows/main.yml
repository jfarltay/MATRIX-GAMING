
name: MATRIX GAMING 5.23 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Download APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Locate project
        shell: bash
        run: |
          set -e
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            PROJECT=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "*/.git/*" -printf '%h\n' | head -n 1)
            if [ -z "$PROJECT" ]; then
              echo "Android project not found"
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          fi

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean :app:assembleDebug

      - name: Prepare APK for installation
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/MATRIX-GAMING-5.23.apk
          cat > release/INSTALL.txt <<'EOF'
          MATRIX GAMING 5.23
          Install:
          1. Download the APK.
          2. Open it on your Android phone.
          3. Allow installation from this source if Android asks.
          4. Tap Install.
          EOF
          ls -lh release/

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.23-APK-DOWNLOAD
          path: release/*
          if-no-files-found: error
          retention-days: 14
