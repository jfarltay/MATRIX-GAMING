
name: MATRIX GAMING Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDK manager is missing from the runner."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager
            exit 1
          fi

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK components
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle ] && [ -f app/build.gradle ]; then
            PROJECT="$PWD"
          else
            PROJECT_SETTINGS="$(find . -type f \
              -name settings.gradle \
              -not -path '*/build/*' \
              -print -quit)"

            if [ -z "$PROJECT_SETTINGS" ]; then
              echo "settings.gradle not found."
              exit 1
            fi

            PROJECT="$(dirname "$PROJECT_SETTINGS")"
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
