
name: MATRIX GAMING Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname 'MATRIX_GAMING*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No MATRIX_GAMING project ZIP found."
            exit 1
          fi

          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_SETTINGS="$(find extracted_project \
            -type f -name settings.gradle -print -quit)"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle not found after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/cpp/CMakeLists.txt

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace \
            --warning-mode all \
            clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
