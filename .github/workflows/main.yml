
name: MATRIX GAMING 5.2 - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract MATRIX source ZIP
        id: project
        shell: bash
        run: |
          set -e
          ZIP_FILE="MATRIX_GAMING_5.2_SETTINGS_MUSIC_UPDATE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Locate Android SDK tools
        id: sdk
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "manager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | "${{ steps.sdk.outputs.manager }}" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "${{ steps.sdk.outputs.manager }}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build MATRIX GAMING APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.dir }}" \
            clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.2-APK
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
