
name: MATRIX GAMING 5.18 - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

concurrency:
  group: matrix-gaming-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_FILE: MATRIX_GAMING_5.18_GAMING_HUD_AND_PROFILES.zip
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      GRADLE_VERSION: 8.9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            echo "ZIP files in repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/matrix-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/matrix-source"

          SETTINGS_FILE="$(
            find "$RUNNER_TEMP/matrix-source" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found"
            find "$RUNNER_TEMP/matrix-source" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found in app module"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle(.kts) not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=$?
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Project directory: $PWD"
          echo "Java version:"
          java -version

          echo "Gradle version:"
          gradle --version

          echo "Android manifest:"
          test -s app/src/main/AndroidManifest.xml

          echo "Source files:"
          find app/src/main -type f | head -100

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            clean :app:assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/matrix-apk"
          cp "$APK" "$RUNNER_TEMP/matrix-apk/MATRIX-GAMING-5.18-debug.apk"

          echo "APK generated successfully"
          ls -lh "$RUNNER_TEMP/matrix-apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.18-APK
          path: ${{ runner.temp }}/matrix-apk/MATRIX-GAMING-5.18-debug.apk
          if-no-files-found: error
          retention-days: 14
