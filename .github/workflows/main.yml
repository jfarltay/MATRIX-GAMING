
name: MATRIX GAMING 4.0 - APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MATRIX GAMING
        uses: actions/checkout@v4

      - name: Extract ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _extracted
          while IFS= read -r -d '' file; do
            echo "Extracting $file"
            unzip -oq "$file" -d _extracted
          done < <(find . -maxdepth 3 -type f -name '*.zip' \
            -not -path './_extracted/*' -print0)

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . \
            \( -path './.git' -o -path './.gradle' \) -prune -o \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MATRIX GAMING 4.0
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        run: |
          test -s "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload MATRIX GAMING APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-4.0-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
