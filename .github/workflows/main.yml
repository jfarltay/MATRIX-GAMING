
name: MATRIX GAMING 5.0.2 - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: matrix-gaming-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MATRIX GAMING APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android project..."

          mapfile -t projects < <(
            find . -type f \( \
              -name settings.gradle -o \
              -name settings.gradle.kts \
            \) -not -path './.git/*' -printf '%h\n' | sort
          )

          if [ "${#projects[@]}" -eq 0 ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*MATRIX*5.0.2*.zip' -print -quit)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting project: $ZIP_FILE"
              mkdir -p extracted_project
              unzip -q "$ZIP_FILE" -d extracted_project
            else
              echo "::error::Android project not found. Upload MATRIX_GAMING_5.0.2_SOURCE.zip or the project files to GitHub."
              exit 1
            fi

            mapfile -t projects < <(
              find extracted_project -type f \( \
                -name settings.gradle -o \
                -name settings.gradle.kts \
              \) -printf '%h\n' | sort
            )
          fi

          if [ "${#projects[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Android project, found ${#projects[@]}."
            printf '%s\n' "${projects[@]}"
            exit 1
          fi

          PROJECT_DIR="${projects[0]}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/app/build.gradle" || {
            echo "::error::app/build.gradle is missing."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || {
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          }

          echo "Project found: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-GAMING-5.0.2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
